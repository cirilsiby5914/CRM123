<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EngageFlow CRM</title>
<style>
  :root { --bg:#070a13; --panel:#0e1424; --line:#1d2740; --text:#e6ebf5; --muted:#8a96b0; --accent:#6d8cff; --danger:#ff6b6b; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.4 system-ui,sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; align-items:center; gap:12px; padding:14px 20px; border-bottom:1px solid var(--line); }
  h1 { font-size:16px; margin:0 8px 0 0; }
  input, select, button { font:inherit; color:inherit; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
  input:focus, select:focus { outline:1px solid var(--accent); }
  button { background:var(--accent); border-color:var(--accent); color:#fff; cursor:pointer; }
  button.ghost { background:none; color:var(--muted); border-color:var(--line); }
  button.danger { background:none; color:var(--danger); border-color:var(--danger); }
  .spacer { flex:1; }
  main { padding:20px; }
  .muted { color:var(--muted); }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:20px; }
  .stat { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; }
  .stat b { display:block; font-size:22px; margin-top:4px; }
  .board { display:grid; grid-template-columns:repeat(5,minmax(190px,1fr)); gap:12px; overflow-x:auto; }
  .col { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px; min-height:220px; }
  .col h3 { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:4px 2px 10px; }
  .card { background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:10px; margin-bottom:8px; cursor:pointer; }
  .card:hover { border-color:var(--accent); }
  .card small { color:var(--muted); display:block; }
  .tag { display:inline-block; font-size:11px; padding:2px 8px; border-radius:99px; border:1px solid var(--line); color:var(--muted); margin-top:6px; }
  aside { position:fixed; top:0; right:0; width:min(380px,100%); height:100%; background:var(--panel); border-left:1px solid var(--line); padding:20px; overflow:auto; display:none; }
  aside.open { display:block; }
  .form { display:grid; gap:10px; margin-bottom:16px; }
  .form label { display:grid; gap:4px; color:var(--muted); font-size:12px; }
  .row { display:flex; gap:8px; align-items:center; }
  .note { border-top:1px solid var(--line); padding:8px 0; }
  .note small { color:var(--muted); }
  @media (max-width:900px) { .board { grid-template-columns:repeat(5,220px); } }
</style>
</head>
<body>
<header>
  <h1>EngageFlow CRM</h1>
  <input id="q" placeholder="Search name, email, company…" style="width:300px">
  <span class="spacer"></span>
  <button id="new">+ Add contact</button>
</header>
<main>
  <section class="stats" id="stats"></section>
  <section class="board" id="board"></section>
</main>
<aside id="panel"></aside>

<script>
const STAGES = { lead: 'Lead', contacted: 'Contacted', qualified: 'Qualified', customer: 'Customer', lost: 'Lost' };
const CHANNELS = ['WhatsApp', 'Instagram', 'Messenger', 'Telegram', 'Email', 'Website', 'YouTube', 'LinkedIn', 'Phone', 'Other'];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const options = (pairs, selected) => pairs.map(([v, l]) => `<option value="${esc(v)}" ${v === selected ? 'selected' : ''}>${esc(l)}</option>`).join('');
const STAGE_OPTS = Object.entries(STAGES);
const CHANNEL_OPTS = CHANNELS.map(c => [c, c]);

let contacts = [];
let stats = null;

async function api(method, path, body) {
  const res = await fetch('/api' + path, {
    method,
    headers: { 'content-type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}

async function run(fn) {
  try { await fn(); } catch (err) { alert(err.message); }
}

async function load() {
  const q = $('#q').value.trim();
  [contacts, stats] = await Promise.all([
    api('GET', '/contacts?q=' + encodeURIComponent(q)),
    api('GET', '/stats'),
  ]);
  renderStats();
  renderBoard();
}

function renderStats() {
  const open = stats.byStage.lead + stats.byStage.contacted + stats.byStage.qualified;
  $('#stats').innerHTML = [
    ['Contacts', stats.total],
    ['Open leads', open],
    ['Customers', stats.customers],
    ['Conversion', stats.conversionRate + '%'],
  ].map(([label, value]) => `<div class="stat"><span class="muted">${label}</span><b>${value}</b></div>`).join('');
}

function renderBoard() {
  $('#board').innerHTML = STAGE_OPTS.map(([key, label]) => {
    const items = contacts.filter(c => c.stage === key);
    const cards = items.map(c => `
      <div class="card" data-id="${esc(c.id)}">
        <b>${esc(c.name)}</b>
        <small>${esc(c.company || c.email || '—')}</small>
        <span class="tag">${esc(c.channel)}</span>
      </div>`).join('');
    return `<div class="col"><h3>${label} · ${items.length}</h3>${cards || '<small class="muted">Empty</small>'}</div>`;
  }).join('');
}

function closePanel() { $('#panel').classList.remove('open'); }

function openContact(id) {
  const c = contacts.find(x => x.id === id);
  if (!c) return;
  $('#panel').innerHTML = `
    <div class="row">
      <h2 style="margin:0;font-size:18px">${esc(c.name)}</h2>
      <span class="spacer"></span>
      <button class="ghost" id="close">Close</button>
    </div>
    <p class="muted">${esc(c.email)}${c.phone ? ' · ' + esc(c.phone) : ''}<br>${esc(c.company)}</p>
    <div class="form">
      <label>Stage<select id="stage">${options(STAGE_OPTS, c.stage)}</select></label>
      <label>Channel<select id="channel">${options(CHANNEL_OPTS, c.channel)}</select></label>
    </div>
    <h3 style="font-size:13px">Notes</h3>
    <form id="noteForm" class="row" style="margin-bottom:8px">
      <input name="text" placeholder="Add a note" required style="flex:1">
      <button>Add</button>
    </form>
    ${c.notes.slice().reverse().map(n => `
      <div class="note"><small>${new Date(n.at).toLocaleString()}</small><div>${esc(n.text)}</div></div>`).join('') || '<p class="muted">No notes yet.</p>'}
    <p style="margin-top:20px"><button class="danger" id="del">Delete contact</button></p>`;
  $('#panel').classList.add('open');

  $('#close').onclick = closePanel;
  $('#stage').onchange = e => run(async () => {
    await api('PATCH', `/contacts/${id}`, { stage: e.target.value });
    await load(); openContact(id);
  });
  $('#channel').onchange = e => run(async () => {
    await api('PATCH', `/contacts/${id}`, { channel: e.target.value });
    await load(); openContact(id);
  });
  $('#noteForm').onsubmit = e => {
    e.preventDefault();
    run(async () => {
      const text = new FormData(e.target).get('text');
      await api('POST', `/contacts/${id}/notes`, { text });
      await load(); openContact(id);
    });
  };
  $('#del').onclick = () => {
    if (confirm(`Delete ${c.name}?`)) run(async () => {
      await api('DELETE', `/contacts/${id}`);
      closePanel(); await load();
    });
  };
}

function openNew() {
  $('#panel').innerHTML = `
    <div class="row">
      <h2 style="margin:0;font-size:18px">New contact</h2>
      <span class="spacer"></span>
      <button class="ghost" id="close">Close</button>
    </div>
    <form id="newForm" class="form" style="margin-top:16px">
      <label>Name *<input name="name" required></label>
      <label>Email<input name="email" type="email"></label>
      <label>Phone<input name="phone"></label>
      <label>Company<input name="company"></label>
      <label>Channel<select name="channel">${options(CHANNEL_OPTS, 'Other')}</select></label>
      <label>Stage<select name="stage">${options(STAGE_OPTS, 'lead')}</select></label>
      <div class="row"><button>Save contact</button></div>
    </form>`;
  $('#panel').classList.add('open');
  $('#close').onclick = closePanel;
  $('#newForm').onsubmit = e => {
    e.preventDefault();
    run(async () => {
      await api('POST', '/contacts', Object.fromEntries(new FormData(e.target)));
      closePanel(); await load();
    });
  };
}

$('#new').onclick = openNew;
$('#q').oninput = () => run(load);
$('#board').onclick = e => {
  const card = e.target.closest('.card');
  if (card) openContact(card.dataset.id);
};
run(load);
</script>
</body>
</html>
